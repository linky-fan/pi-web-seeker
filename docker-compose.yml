services:
  pi-web:
    build:
      context: .
    image: pi-web:local
    container_name: pi-web
    ports:
      - "${PI_WEB_PORT:-30141}:30141"
    environment:
      PORT: 30141
      PI_WEB_BIND_HOST: 0.0.0.0
      PI_CODING_AGENT_DIR: /home/piweb/.pi/agent
      PI_WEB_HOME: /workspace
      PI_WEB_DEFAULT_CWD: /workspace
      PI_WEB_ALLOWED_ROOTS: /workspace
      PI_WEB_SINGLE_WORKSPACE: "1"
      PI_WEB_UID: ${PI_WEB_UID:-1000}
      PI_WEB_GID: ${PI_WEB_GID:-1000}
      PI_WEB_CHOWN_WORKSPACE: ${PI_WEB_CHOWN_WORKSPACE:-1}
      SKILLS_API_URL: ${SKILLS_API_URL:-https://skills.sh}
    volumes:
      - ${PI_WEB_DATA_DIR:-./.pi-web-data}:/home/piweb/.pi
      - ${PI_WEB_WORKSPACE:-./.pi-web-workspace}:/workspace
      - ${HOME}/.ssh:/home/piweb/.ssh:ro
    restart: unless-stopped
