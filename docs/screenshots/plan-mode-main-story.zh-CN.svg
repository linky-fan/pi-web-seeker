<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">默认计划模式产品叙事图</title>
  <desc id="desc">脱敏的 Plan Mode 产品叙事图，展示从 /plan 到只读探索再到 PlanCard 的路径。</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fefce8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#111827" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#f3f5f8"/>
  <rect x="54" y="46" width="1172" height="628" rx="28" fill="url(#paper)" stroke="#d9e1eb" filter="url(#softShadow)"/>
  <rect x="88" y="82" width="196" height="31" rx="15.5" fill="#fffbeb" stroke="#fde68a"/>
  <text x="104" y="103" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#9a6500">Plan Mode · 默认路径</text>
  <text x="88" y="162" font-family="Arial, 'PingFang SC', sans-serif" font-size="42" font-weight="780" fill="#111827">从一句需求到可执行计划</text>
  <text x="90" y="198" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#64748b">主 agent 被收窄到只读探索，最终把固定结构的计划渲染成 PlanCard。</text>

  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="92" y="260" width="300" height="226" rx="22" fill="#111827"/>
    <rect x="112" y="282" width="260" height="44" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="132" y="310" font-size="18" font-weight="700" fill="#f9fafb">/plan</text>
    <rect x="112" y="348" width="122" height="34" rx="17" fill="#fef3c7"/>
    <text x="133" y="370" font-size="13" font-weight="700" fill="#92400e">Plan 已启用</text>
    <text x="112" y="420" font-size="15" fill="#cbd5e1">用户仍在主对话窗口里工作</text>
    <text x="112" y="448" font-size="15" fill="#cbd5e1">命令不会作为消息发送</text>
    <text x="112" y="476" font-size="15" fill="#cbd5e1">模式按 session 记住</text>

    <path d="M418 374h108" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M526 374l-12-7v14z" fill="#cbd5e1"/>

    <rect x="548" y="236" width="240" height="274" rx="22" fill="#fbfdff" stroke="#dde5ef"/>
    <rect x="576" y="266" width="70" height="70" rx="19" fill="url(#amber)" stroke="#fde68a"/>
    <text x="611" y="309" text-anchor="middle" font-size="28" font-weight="800" fill="#92400e">RO</text>
    <text x="576" y="370" font-size="22" font-weight="760" fill="#1e293b">只读护栏</text>
    <text x="576" y="405" font-size="15" fill="#64748b">允许 read / grep / find / ls</text>
    <text x="576" y="432" font-size="15" fill="#64748b">bash 仅放行检查类命令</text>
    <text x="576" y="459" font-size="15" fill="#64748b">退出时恢复工具和提示词</text>

    <path d="M814 374h108" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M922 374l-12-7v14z" fill="#cbd5e1"/>

    <rect x="944" y="210" width="250" height="330" rx="22" fill="#ffffff" stroke="#d9e1eb"/>
    <rect x="968" y="234" width="86" height="28" rx="14" fill="#fffbeb" stroke="#fde68a"/>
    <text x="989" y="253" font-size="12" font-weight="760" fill="#92400e">PlanCard</text>
    <text x="968" y="304" font-size="24" font-weight="780" fill="#111827">实施计划</text>
    <rect x="968" y="330" width="202" height="54" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="986" y="354" font-size="14" font-weight="700" fill="#334155">摘要</text>
    <text x="986" y="374" font-size="13" fill="#64748b">目标、路线、边界一屏可读</text>
    <line x1="968" y1="420" x2="1170" y2="420" stroke="#e2e8f0"/>
    <text x="968" y="454" font-size="14" font-weight="700" fill="#334155">目标与验收</text>
    <text x="968" y="484" font-size="14" font-weight="700" fill="#334155">实施方案</text>
    <text x="968" y="514" font-size="14" font-weight="700" fill="#334155">测试计划</text>
  </g>

  <g font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#475569">
    <rect x="90" y="594" width="142" height="36" rx="18" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="161" y="617" text-anchor="middle">无需扩展</text>
    <rect x="246" y="594" width="186" height="36" rx="18" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="339" y="617" text-anchor="middle">不产生文件修改</text>
    <rect x="446" y="594" width="212" height="36" rx="18" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="552" y="617" text-anchor="middle">计划可交给工程师执行</text>
  </g>
</svg>
