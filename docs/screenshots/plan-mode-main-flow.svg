<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Default Plan Mode flow</title>
  <desc id="desc">Sanitized release documentation diagram for the default Pi Web Plan Mode flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#18202c" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
