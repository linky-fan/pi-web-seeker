<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Plan subagent 调用流</title>
  <desc id="desc">用于发布文档的可选 Plan subagent 脱敏调用图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#18202c" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="70" y="76" width="1060" height="528" rx="22" fill="#ffffff" stroke="#d9e0ea"/>
  </g>
  <path d="M92 76h1016a22 22 0 0 1 22 22v118H70V98a22 22 0 0 1 22-22z" fill="#fbfcfe" stroke="#e7ecf3"/>
  <rect x="104" y="104" width="186" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="120" y="124" font-family="Inter, Arial, 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Pi Web Seeker - 计划模式</text>
  <text x="104" y="166" font-family="Inter, Arial, 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="38" font-weight="780" fill="#18202c">Plan subagent 增强</text>
  <text x="104" y="198" font-family="Inter, Arial, 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="17" fill="#64748b">当 pi-subagents 工具可用时，显式使用更严格的计划子智能体路径。</text>
  <g font-family="Inter, Arial, 'Noto Sans CJK SC', 'PingFang SC', sans-serif">
    <g transform="translate(98 260)">
      <rect width="158" height="142" rx="16" fill="#fbfdff" stroke="#dde5ef"/>
      <rect x="18" y="18" width="30" height="30" rx="9" fill="#dbeafe"/>
      <text x="33" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">1</text>
      <text x="18" y="96" font-size="16" font-weight="720" fill="#1e293b">输入命令</text>
      <text x="18" y="119" font-size="16" font-weight="720" fill="#1e293b">/plan-subagent</text>
    </g>
    <g transform="translate(273 260)">
      <rect width="158" height="142" rx="16" fill="#fbfdff" stroke="#dde5ef"/>
      <rect x="18" y="18" width="30" height="30" rx="9" fill="#dbeafe"/>
      <text x="33" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">2</text>
      <text x="18" y="96" font-size="16" font-weight="720" fill="#1e293b">RPC 同步</text>
      <text x="18" y="119" font-size="16" font-weight="720" fill="#1e293b">set_plan_mode</text>
    </g>
    <g transform="translate(448 260)">
      <rect width="158" height="142" rx="16" fill="#fbfdff" stroke="#dde5ef"/>
      <rect x="18" y="18" width="30" height="30" rx="9" fill="#dbeafe"/>
      <text x="33" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">3</text>
      <text x="18" y="96" font-size="16" font-weight="720" fill="#1e293b">主 agent</text>
      <text x="18" y="119" font-size="16" font-weight="720" fill="#1e293b">只做编排</text>
    </g>
    <g transform="translate(623 260)">
      <rect width="158" height="142" rx="16" fill="#fbfdff" stroke="#dde5ef"/>
      <rect x="18" y="18" width="30" height="30" rx="9" fill="#dbeafe"/>
      <text x="33" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">4</text>
      <text x="18" y="96" font-size="16" font-weight="720" fill="#1e293b">Plan subagent</text>
      <text x="18" y="119" font-size="16" font-weight="720" fill="#1e293b">只读探索</text>
    </g>
    <g transform="translate(798 260)">
      <rect width="158" height="142" rx="16" fill="#fbfdff" stroke="#dde5ef"/>
      <rect x="18" y="18" width="30" height="30" rx="9" fill="#dbeafe"/>
      <text x="33" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">5</text>
      <text x="18" y="96" font-size="16" font-weight="720" fill="#1e293b">读取结果</text>
      <text x="18" y="119" font-size="16" font-weight="720" fill="#1e293b">get_subagent_result</text>
    </g>
    <g transform="translate(973 260)">
      <rect width="128" height="142" rx="16" fill="#fbfdff" stroke="#dde5ef"/>
      <rect x="18" y="18" width="30" height="30" rx="9" fill="#dbeafe"/>
      <text x="33" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">6</text>
      <text x="18" y="96" font-size="16" font-weight="720" fill="#1e293b">PlanCard</text>
      <text x="18" y="119" font-size="16" font-weight="720" fill="#1e293b">展示</text>
    </g>
  </g>
  <g fill="#ffffff" stroke="#d7e0ec">
    <circle cx="265" cy="331" r="12"/><circle cx="440" cy="331" r="12"/><circle cx="615" cy="331" r="12"/><circle cx="790" cy="331" r="12"/><circle cx="965" cy="331" r="12"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="24" fill="#64748b">
    <text x="265" y="338" text-anchor="middle">&gt;</text><text x="440" y="338" text-anchor="middle">&gt;</text><text x="615" y="338" text-anchor="middle">&gt;</text><text x="790" y="338" text-anchor="middle">&gt;</text><text x="965" y="338" text-anchor="middle">&gt;</text>
  </g>
  <g font-family="Inter, Arial, 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="13" font-weight="650" fill="#475569">
    <rect x="98" y="450" width="232" height="34" rx="17" fill="#f8fafc" stroke="#dbe3ee"/><text x="214" y="472" text-anchor="middle">需要 Agent + get_subagent_result</text>
    <rect x="342" y="450" width="172" height="34" rx="17" fill="#f8fafc" stroke="#dbe3ee"/><text x="428" y="472" text-anchor="middle">/plan 不会隐式降级</text>
    <rect x="526" y="450" width="160" height="34" rx="17" fill="#f8fafc" stroke="#dbe3ee"/><text x="606" y="472" text-anchor="middle">按 session 记住</text>
  </g>
  <text x="98" y="540" font-family="Inter, Arial, 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="13" fill="#64748b">发布文档脱敏图：只展示调用流；不包含 session 列表、私有路径或真实对话。</text>
</svg>
