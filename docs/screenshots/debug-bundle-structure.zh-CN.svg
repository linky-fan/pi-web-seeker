<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Debug Bundle 结构图</title>
  <desc id="desc">脱敏的 Debug Bundle 结构图，展示 tar.gz 中的 manifest、session、media、workspace 和 diagnostics。</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#111827" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#f3f5f8"/>
  <rect x="54" y="46" width="1172" height="628" rx="28" fill="url(#paper)" stroke="#d9e1eb" filter="url(#softShadow)"/>
  <rect x="88" y="82" width="204" height="31" rx="15.5" fill="#ecfeff" stroke="#99f6e4"/>
  <text x="104" y="103" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#0f766e">Debug Bundle · tar.gz</text>
  <text x="88" y="162" font-family="Arial, 'PingFang SC', sans-serif" font-size="42" font-weight="780" fill="#111827">跨机器调试需要的是完整证据包</text>
  <text x="90" y="198" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#64748b">普通 JSON 适合阅读；Debug Bundle 把会话、媒体、工作区快照和诊断信息一起恢复到 sandbox。</text>

  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="92" y="248" width="312" height="296" rx="24" fill="#0f172a"/>
    <text x="124" y="296" font-size="20" font-weight="780" fill="#f8fafc">pi-debug-bundle.tar.gz</text>
    <text x="124" y="336" font-size="15" fill="#cbd5e1">inspect 先校验</text>
    <text x="124" y="366" font-size="15" fill="#cbd5e1">import 再恢复</text>
    <rect x="124" y="408" width="224" height="46" rx="14" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="146" y="437" font-size="15" font-weight="760" fill="#ccfbf1">目标：新的 sandbox cwd</text>
    <text x="124" y="498" font-size="14" fill="#94a3b8">原始 cwd 只保留为 manifest 元数据</text>

    <path d="M430 396h72" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M502 396l-12-7v14z" fill="#cbd5e1"/>

    <rect x="524" y="238" width="614" height="344" rx="24" fill="#fbfdff" stroke="#dce5ef"/>
    <text x="556" y="286" font-size="22" font-weight="780" fill="#111827">Bundle 内容</text>

    <g transform="translate(556 322)">
      <rect width="238" height="74" rx="16" fill="url(#mint)" stroke="#99f6e4"/>
      <text x="22" y="32" font-size="16" font-weight="780" fill="#0f766e">manifest.json</text>
      <text x="22" y="56" font-size="13" fill="#475569">schema、hash、warning、原始 cwd</text>
    </g>
    <g transform="translate(828 322)">
      <rect width="238" height="74" rx="16" fill="#ffffff" stroke="#dbe3ee"/>
      <text x="22" y="32" font-size="16" font-weight="780" fill="#1e293b">session/session.jsonl</text>
      <text x="22" y="56" font-size="13" fill="#64748b">规范 header + entries</text>
    </g>
    <g transform="translate(556 420)">
      <rect width="238" height="74" rx="16" fill="#ffffff" stroke="#dbe3ee"/>
      <text x="22" y="32" font-size="16" font-weight="780" fill="#1e293b">media/&lt;sha256&gt;.*</text>
      <text x="22" y="56" font-size="13" fill="#64748b">inline 图片外置并去重</text>
    </g>
    <g transform="translate(828 420)">
      <rect width="238" height="74" rx="16" fill="#ffffff" stroke="#dbe3ee"/>
      <text x="22" y="32" font-size="16" font-weight="780" fill="#1e293b">workspace/*</text>
      <text x="22" y="56" font-size="13" fill="#64748b">tracked + 未忽略 untracked</text>
    </g>
    <g transform="translate(556 518)">
      <rect width="510" height="42" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
      <text x="22" y="27" font-size="14" font-weight="700" fill="#334155">diagnostics/environment.json</text>
      <text x="246" y="27" font-size="14" fill="#64748b">脱敏平台、runtime、package 信息，不包含 secret</text>
    </g>
  </g>

  <g font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#475569">
    <rect x="90" y="604" width="164" height="36" rx="18" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="172" y="627" text-anchor="middle">默认不覆盖原路径</text>
    <rect x="268" y="604" width="186" height="36" rx="18" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="361" y="627" text-anchor="middle">导入后媒体可继续显示</text>
    <rect x="468" y="604" width="210" height="36" rx="18" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="573" y="627" text-anchor="middle">继续运行取决于目标环境</text>
  </g>
</svg>
