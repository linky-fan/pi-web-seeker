<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Plan via Subagent flow</title>
  <desc id="desc">Sanitized release documentation diagram for the optional Plan via Subagent flow.</desc>
  <defs>
